<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph | Quick Entry</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Tahoma, Arial, sans-serif;
        background: radial-gradient(circle at top right, rgba(34, 197, 94, 0.15), transparent 30%),
          linear-gradient(135deg, #020617, #0f172a 48%, #111827);
        color: #e2e8f0;
      }
      .card {
        width: min(560px, calc(100% - 24px));
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 18px;
        padding: 20px;
        display: grid;
        gap: 12px;
      }
      .btn {
        text-decoration: none;
        border-radius: 12px;
        padding: 14px;
        text-align: center;
        font-weight: 700;
      }
      .btn.create { background: #22c55e; color: #052e16; }
      .btn.login { background: #38bdf8; color: #082f49; }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Graph</h1>
      <a class="btn create" href="/local-meeting-app-nf/public/create-room.html">➕ ساخت روم</a>
      <a class="btn login" href="/local-meeting-app-nf/public/login.html">🚪 ورود به روم</a>
    </section>
  </body>
</html>
